<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dommeliedjes — Trein Avontuur</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a2e;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Comic Sans MS','Segoe UI',cursive,sans-serif}
  #wrap{position:relative}
  canvas{display:block;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,0.5);cursor:pointer}
  #hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:12px;pointer-events:none;user-select:none}
  #muteBtn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.4);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;transition:background 0.2s;z-index:10}
  #muteBtn:hover{background:rgba(0,0,0,0.6)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hint">Dommeliedjes · Trein Avontuur (Klik ergens om te starten)</div>
  <button id="muteBtn" title="Geluid aan/uit">🔇</button>
  
  <!-- LET OP: Pas hieronder de naam van je audiobestand aan! -->
  <audio id="bgm" src="silly song.mp3" loop></audio>
</div>
<script>
"use strict";
// ================= CONFIG =================
const VW=1280, VH=720;
const GROUND_Y = 540;
const TANDEM_X = 380;
const SCROLL_SPEED = 140;
const TOTAL = 20; // Exact 20 seconden
const STOP_TIME = 16.0; // Start met remmen in Kolhorn
const EASE_TIME = 2.0; // Duur van het afremmen

const LETTERS = ['d','o','m','m','e','l','i','e','d','j','e','s'];

const SCENES = [
  {type:'forest',    s:0,    e:1.6},
  {type:'mountains', s:1.6,  e:3.2},
  {type:'village',   s:3.2,  e:4.8},
  {type:'castle',    s:4.8,  e:6.4},
  {type:'river',     s:6.4,  e:8.0},
  {type:'forest',    s:8.0,  e:9.6},
  {type:'mountains', s:9.6,  e:11.2},
  {type:'village',   s:11.2, e:12.8},
  {type:'river',     s:12.8, e:14.4},
  {type:'castle',    s:14.4, e:16.0},
  {type:'kolhorn',   s:16.0, e:20.0},
];

// ================= AUDIO LOGIC =================
const bgm = document.getElementById('bgm');
const muteBtn = document.getElementById('muteBtn');
let isMuted = true;

function toggleMute() {
  isMuted = !isMuted;
  bgm.muted = isMuted;
  muteBtn.textContent = isMuted ? '🔇' : '🔊';
  if(!isMuted && bgm.paused) {
    bgm.play().catch(() => console.log("Audio play geblokkeerd door browser"));
  }
}

muteBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleMute();
});

// Zorg dat het liedje start bij de eerste klik ergens in het scherm
document.body.addEventListener('click', () => {
  if (bgm.paused) {
    isMuted = false;
    bgm.muted = false;
    muteBtn.textContent = '🔊';
    bgm.play().catch(() => console.log("Audio play geblokkeerd door browser"));
  }
}, {once: true});

// ================= CANVAS =================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = VW; cv.height = VH;

function fitCanvas() {
  const scale = Math.min(window.innerWidth/VW, window.innerHeight/VH);
  cv.style.width = (VW*scale)+'px';
  cv.style.height = (VH*scale)+'px';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// ================= UTILS =================
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const easeOutCubic = t=>1-Math.pow(1-t,3);
const easeOutBack = t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function hash(n){return((Math.sin(n*12.9898)*43758.5453)%1+1)%1}

// ================= STATE =================
let startTime=null;
let particles = [];
let lettersSparkled = {};
let finalExplosionDone = false;

// ================= SKY COLORS =================
const SKY = {
  forest:    {top:[135,206,235], bot:[200,230,255]},
  mountains: {top:[100,149,237], bot:[176,224,230]},
  village:   {top:[135,206,250], bot:[255,228,196]},
  castle:    {top:[123,104,238], bot:[221,160,221]},
  river:     {top:[135,206,235], bot:[176,224,230]},
  kolhorn:   {top:[255,180,80],  bot:[255,220,140]},
};
const SKY_DEFAULT = {top:[135,206,235], bot:[200,230,255]};

function getSkyColor(elapsed){
  const si = getSceneIndex(elapsed);
  if(si<0) return SKY_DEFAULT;
  const sc = SCENES[si];
  const cur = SKY[sc.type] || SKY_DEFAULT;
  if(sc.e - elapsed < 0.4 && si < SCENES.length-1){
    const next = SKY[SCENES[si+1].type] || SKY_DEFAULT;
    const t = 1 - (sc.e - elapsed)/0.4;
    return {top:cur.top.map((v,i)=>lerp(v,next.top[i],t)), bot:cur.bot.map((v,i)=>lerp(v,next.bot[i],t))};
  }
  return cur;
}

function getSceneIndex(elapsed){
  for(let i=0;i<SCENES.length;i++){
    if(elapsed>=SCENES[i].s && elapsed<SCENES[i].e) return i;
  }
  return SCENES.length-1;
}

// ================= SCROLL LOGIC =================
function getScrollOffset(elapsed) {
  if (elapsed <= STOP_TIME) return elapsed * SCROLL_SPEED;
  if (elapsed >= STOP_TIME + EASE_TIME) {
    return STOP_TIME * SCROLL_SPEED + (SCROLL_SPEED * EASE_TIME) / 2;
  }
  const t = (elapsed - STOP_TIME) / EASE_TIME;
  return STOP_TIME * SCROLL_SPEED + SCROLL_SPEED * EASE_TIME * (t - t*t/2);
}

function getScrollSpeed(elapsed) {
  if (elapsed <= STOP_TIME) return SCROLL_SPEED;
  if (elapsed >= STOP_TIME + EASE_TIME) return 0;
  const t = (elapsed - STOP_TIME) / EASE_TIME;
  return SCROLL_SPEED * (1 - t);
}

// ================= DRAWING: SKY & CLOUDS =================
function drawSky(elapsed){
  const sky = getSkyColor(elapsed);
  const g = ctx.createLinearGradient(0,0,0,GROUND_Y+20);
  g.addColorStop(0, `rgb(${sky.top.map(Math.round).join(',')})`);
  g.addColorStop(1, `rgb(${sky.bot.map(Math.round).join(',')})`);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,VW,GROUND_Y+20);
  
  const sunX = VW*0.8;
  const sunY = 80;
  ctx.save();
  ctx.shadowColor='rgba(255,240,150,0.8)';
  ctx.shadowBlur=40;
  ctx.fillStyle='rgba(255,250,200,0.9)';
  ctx.beginPath(); ctx.arc(sunX,sunY,35,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawClouds(offset){
  ctx.fillStyle='rgba(255,255,255,0.75)';
  const sp=300, spd=0.15, wo=offset*spd, first=Math.floor(wo/sp)*sp;
  for(let wx=first; wx<wo+VW+200; wx+=sp){
    const sx=wx-wo, seed=hash(wx*0.7), cy=60+seed*60, cw=60+seed*30;
    ctx.beginPath();
    ctx.arc(sx,cy,cw*0.5,0,Math.PI*2);
    ctx.arc(sx+cw*0.4,cy-cw*0.2,cw*0.4,0,Math.PI*2);
    ctx.arc(sx+cw*0.7,cy,cw*0.45,0,Math.PI*2);
    ctx.arc(sx+cw*0.3,cy+cw*0.1,cw*0.35,0,Math.PI*2);
    ctx.fill();
  }
}

// ================= DRAWING: GROUND & RAILS =================
function drawGround(sceneType, offset){
  ctx.fillStyle = sceneType==='kolhorn' ? '#7CB342' : '#6abe5a';
  ctx.fillRect(0,GROUND_Y,VW,VH-GROUND_Y);
  
  // Strakke grijze lijn over de gehele breedte
  ctx.fillStyle = '#6a6a6a';
  ctx.fillRect(0, GROUND_Y - 2, VW, 8);
  
  // Graspolletjes
  ctx.strokeStyle='#4a9a3a'; ctx.lineWidth=1.5;
  const tuftSp=25, tuftOff=offset%tuftSp;
  for(let x=-tuftOff; x<VW; x+=tuftSp){
    if(hash(x*0.13)>0.5){
      ctx.beginPath();
      ctx.moveTo(x,GROUND_Y+2); ctx.lineTo(x-3,GROUND_Y-5);
      ctx.moveTo(x,GROUND_Y+2); ctx.lineTo(x+3,GROUND_Y-5);
      ctx.moveTo(x,GROUND_Y+2); ctx.lineTo(x,GROUND_Y-7);
      ctx.stroke();
    }
  }
}

// ================= BACKGROUND ELEMENTS =================
function drawForest(offset, layer){
  const layers = {far:{sp:200,spd:0.2,sz:1.0,col:'#2d6a3e'}, mid:{sp:160,spd:0.5,sz:1.3,col:'#3a8a4a'}, near:{sp:120,spd:0.85,sz:1.6,col:'#4a9a5a'}};
  const L=layers[layer], wo=offset*L.spd, first=Math.floor(wo/L.sp)*L.sp;
  for(let wx=first; wx<wo+VW+100; wx+=L.sp){
    const sx=wx-wo, s=hash(wx*0.11), h=(60+s*40)*L.sz, w=h*0.6;
    const gy = layer==='far'?GROUND_Y-20:layer==='mid'?GROUND_Y-10:GROUND_Y;
    ctx.fillStyle='#5a3a2a'; ctx.fillRect(sx-w*0.08, gy-h*0.3, w*0.16, h*0.3);
    ctx.fillStyle=L.col;
    ctx.beginPath(); ctx.moveTo(sx, gy-h*0.3-h); ctx.lineTo(sx-w*0.5, gy-h*0.3); ctx.lineTo(sx+w*0.5, gy-h*0.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx, gy-h*0.3-h*0.7); ctx.lineTo(sx-w*0.4, gy-h*0.3-h*0.2); ctx.lineTo(sx+w*0.4, gy-h*0.3-h*0.2); ctx.fill();
  }
}

function drawMountains(offset, layer){
  if(layer==='far'){
    const sp=350, spd=0.15, wo=offset*spd, first=Math.floor(wo/sp)*sp;
    for(let wx=first; wx<wo+VW+200; wx+=sp){
      const sx=wx-wo, h=150+hash(wx*0.09)*100, w=h*1.8;
      ctx.fillStyle='#6a7a8a';
      ctx.beginPath(); ctx.moveTo(sx,GROUND_Y); ctx.lineTo(sx-w/2,GROUND_Y-h*0.3); ctx.lineTo(sx,GROUND_Y-h); ctx.lineTo(sx+w/2,GROUND_Y-h*0.3); ctx.fill();
      ctx.fillStyle='#f0f0ff';
      ctx.beginPath(); ctx.moveTo(sx,GROUND_Y-h); ctx.lineTo(sx-w*0.15,GROUND_Y-h*0.7); ctx.lineTo(sx-w*0.05,GROUND_Y-h*0.75); ctx.lineTo(sx,GROUND_Y-h*0.6); ctx.lineTo(sx+w*0.05,GROUND_Y-h*0.75); ctx.lineTo(sx+w*0.15,GROUND_Y-h*0.7); ctx.fill();
    }
  } else if(layer==='mid'){
    const sp=130, spd=0.45, wo=offset*spd, first=Math.floor(wo/sp)*sp;
    for(let wx=first; wx<wo+VW+100; wx+=sp){
      const sx=wx-wo, h=50+hash(wx*0.14)*30, w=h*0.5;
      ctx.fillStyle='#3a6a4a';
      ctx.beginPath(); ctx.moveTo(sx,GROUND_Y-15); ctx.lineTo(sx-w,GROUND_Y); ctx.lineTo(sx+w,GROUND_Y); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx,GROUND_Y-15-h*0.7); ctx.lineTo(sx-w*0.8,GROUND_Y-15); ctx.lineTo(sx+w*0.8,GROUND_Y-15); ctx.fill();
    }
  }
}

function drawVillage(offset, layer){
  if(layer==='far'){
    const sp=500, spd=0.2, wo=offset*spd, first=Math.floor(wo/sp)*sp;
    for(let wx=first; wx<wo+VW+200; wx+=sp){
      const sx=wx-wo;
      ctx.fillStyle='#d4c4a0'; ctx.fillRect(sx-20,GROUND_Y-60,40,60);
      ctx.fillStyle='#b06030'; ctx.beginPath(); ctx.moveTo(sx-22,GROUND_Y-60); ctx.lineTo(sx,GROUND_Y-100); ctx.lineTo(sx+22,GROUND_Y-60); ctx.fill();
    }
  } else if(layer==='mid'){
    const sp=140, spd=0.5, wo=offset*spd, first=Math.floor(wo/sp)*sp, cols=['#e88080','#80b0e8','#e8e080','#a0e8a0','#e8a0c0'];
    for(let wx=first; wx<wo+VW+100; wx+=sp){
      const sx=wx-wo, s=hash(wx*0.15), hw=50+s*20, hh=45+s*20;
      ctx.fillStyle=cols[Math.floor(s*cols.length)]; ctx.fillRect(sx-hw/2,GROUND_Y-hh,hw,hh);
      ctx.fillStyle='#8a4030'; ctx.beginPath(); ctx.moveTo(sx-hw/2-5,GROUND_Y-hh); ctx.lineTo(sx,GROUND_Y-hh-25); ctx.lineTo(sx+hw/2+5,GROUND_Y-hh); ctx.fill();
      ctx.fillStyle='#FFE082'; ctx.fillRect(sx-8,GROUND_Y-hh+15,16,14);
    }
  }
}

function drawCastle(offset, layer){
  if(layer==='far'){
    const sp=600, spd=0.18, wo=offset*spd, first=Math.floor(wo/sp)*sp;
    for(let wx=first; wx<wo+VW+200; wx+=sp){
      const sx=wx-wo;
      ctx.fillStyle='#5a5a6a'; ctx.beginPath(); ctx.moveTo(sx-150,GROUND_Y); ctx.lineTo(sx,GROUND_Y-80); ctx.lineTo(sx+150,GROUND_Y); ctx.fill();
      ctx.fillStyle='#8a7a8a'; ctx.fillRect(sx-70,GROUND_Y-100,140,70); ctx.fillRect(sx-80,GROUND_Y-130,25,100); ctx.fillRect(sx+55,GROUND_Y-130,25,100);
    }
  } else if(layer==='mid'){
    const sp=200, spd=0.45, wo=offset*spd, first=Math.floor(wo/sp)*sp;
    for(let wx=first; wx<wo+VW+100; wx+=sp){
      const sx=wx-wo, h=40+hash(wx*0.19)*30;
      ctx.fillStyle='#9a8a9a'; ctx.fillRect(sx-12,GROUND_Y-h,24,h);
      ctx.fillStyle='#7a6a7a'; ctx.beginPath(); ctx.moveTo(sx-14,GROUND_Y-h); ctx.lineTo(sx,GROUND_Y-h-15); ctx.lineTo(sx+14,GROUND_Y-h); ctx.fill();
    }
  }
}

function drawRiver(offset, layer){
  if(layer==='far'){
    const sp=400, spd=0.2, wo=offset*spd, first=Math.floor(wo/sp)*sp;
    for(let wx=first; wx<wo+VW+200; wx+=sp){
      const sx=wx-wo;
      ctx.fillStyle='#5a8a5a'; ctx.beginPath(); ctx.moveTo(sx-200,GROUND_Y-20); ctx.quadraticCurveTo(sx,GROUND_Y-60,sx+200,GROUND_Y-20); ctx.lineTo(sx+200,GROUND_Y); ctx.lineTo(sx-200,GROUND_Y); ctx.fill();
    }
  } else if(layer==='mid'){
    ctx.fillStyle='#4a90c4'; ctx.fillRect(0,GROUND_Y-8,VW,16);
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2;
    for(let x=0;x<VW;x+=20){ ctx.beginPath(); ctx.moveTo(x,GROUND_Y-8+Math.sin((x+offset*0.5)*0.05)*3); ctx.lineTo(x+15,GROUND_Y-8+Math.sin((x+15+offset*0.5)*0.05)*3); ctx.stroke(); }
  }
}

function drawKolhorn(offset, layer){
  if(layer==='far'){
    const sp=800, spd=0.15, wo=offset*spd, first=Math.floor(wo/sp)*sp;
    for(let wx=first; wx<wo+VW+300; wx+=sp){
      const sx=wx-wo;
      ctx.fillStyle='#c4a070'; ctx.beginPath(); ctx.moveTo(sx-25,GROUND_Y); ctx.lineTo(sx-15,GROUND_Y-80); ctx.lineTo(sx+15,GROUND_Y-80); ctx.lineTo(sx+25,GROUND_Y); ctx.fill();
      ctx.fillStyle='#8a6030'; ctx.beginPath(); ctx.ellipse(sx,GROUND_Y-80,18,12,0,0,Math.PI*2); ctx.fill();
      ctx.save(); ctx.translate(sx,GROUND_Y-80); ctx.rotate(offset*0.01); ctx.strokeStyle='#5a3a2a'; ctx.lineWidth=4;
      for(let b=0;b<4;b++){
        ctx.save(); ctx.rotate(b*Math.PI/2); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-40); ctx.stroke();
        ctx.fillStyle='rgba(255,255,240,0.7)'; ctx.beginPath(); ctx.moveTo(2,0); ctx.lineTo(2,-35); ctx.lineTo(-5,-35); ctx.lineTo(-5,0); ctx.fill(); ctx.restore();
      }
      ctx.restore();
    }
    ctx.fillStyle='#8a9a5a'; ctx.fillRect(0,GROUND_Y-15,VW,15);
  } else if(layer==='mid'){
    const sp=130, spd=0.5, wo=offset*spd, first=Math.floor(wo/sp)*sp, cols=['#c44','#48c','#cc4','#4c8','#c4c','#8c4'];
    for(let wx=first; wx<wo+VW+100; wx+=sp){
      const sx=wx-wo, s=hash(wx*0.16), hw=45+s*15, hh=40+s*15;
      ctx.fillStyle=cols[Math.floor(s*cols.length)]; ctx.fillRect(sx-hw/2,GROUND_Y-hh,hw,hh);
      ctx.fillStyle='#6a3020'; for(let st=0;st<3;st++){ const sw=hw-st*8; ctx.fillRect(sx-sw/2,GROUND_Y-hh-8-st*6,sw,6); }
      ctx.fillStyle='#FFE082'; ctx.fillRect(sx-7,GROUND_Y-hh+12,14,12);
    }
  }
}

function drawBackground(sceneType, offset, layer){
  switch(sceneType){
    case 'forest': drawForest(offset,layer); break;
    case 'mountains': drawMountains(offset,layer); break;
    case 'village': drawVillage(offset,layer); break;
    case 'castle': drawCastle(offset,layer); break;
    case 'river': drawRiver(offset,layer); break;
    case 'kolhorn': drawKolhorn(offset,layer); break;
  }
}

// ================= TRAIN =================
function drawWheel(cx,cy,r,rotation){
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#222'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.65,0,Math.PI*2); ctx.fillStyle='#aaa'; ctx.fill();
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rotation); ctx.strokeStyle='#666'; ctx.lineWidth=1.5;
  for(let i=0;i<8;i++){ const a=(i/8)*Math.PI*2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*0.6,Math.sin(a)*r*0.6); ctx.stroke(); }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.fillStyle='#444'; ctx.fill();
}

function drawTrainWindow(wx, wy, ww, wh, hasPassenger){
  ctx.fillStyle = '#1565C0'; ctx.fillRect(wx-2, wy-2, ww+4, wh+4);
  ctx.fillStyle = 'rgba(100,160,210,0.75)'; ctx.fillRect(wx, wy, ww, wh);
  if(hasPassenger){
    ctx.fillStyle = '#FFDBAC'; ctx.beginPath(); ctx.arc(wx+ww/2, wy+wh/2-2, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a8'; ctx.fillRect(wx+ww/2-7, wy+wh/2+4, 14, 10);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.moveTo(wx+3, wy+2); ctx.lineTo(wx+12, wy+2); ctx.lineTo(wx+3, wy+11); ctx.fill();
}

function tailStart(tailTip){ return tailTip + 8; }

function drawTrain(x, y, elapsed, scrollSpd){
  const speedRatio = scrollSpd / SCROLL_SPEED;
  const rot = elapsed * scrollSpd * 0.05;

  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.beginPath(); ctx.ellipse(x+10, y+5, 130, 9, 0, 0, Math.PI*2); ctx.fill();

  const bodyTop = y - 58, bodyBot = y - 6, bodyH = bodyBot - bodyTop;
  const noseTip = x + 115, noseStart = x + 55, tailTip = x - 110;

  ctx.fillStyle = '#eaeef6';
  ctx.beginPath(); ctx.moveTo(tailTip, bodyTop + bodyH/2); ctx.quadraticCurveTo(tailTip, bodyTop, tailStart(tailTip), bodyTop); ctx.lineTo(noseStart, bodyTop);
  ctx.quadraticCurveTo(noseTip-8, bodyTop, noseTip, bodyTop+22); ctx.quadraticCurveTo(noseTip+2, bodyBot, noseStart, bodyBot);
  ctx.lineTo(tailStart(tailTip), bodyBot); ctx.quadraticCurveTo(tailTip, bodyBot, tailTip, bodyTop+bodyH/2); ctx.fill();

  ctx.fillStyle = '#1976D2';
  ctx.beginPath(); ctx.moveTo(tailTip+2, bodyBot-14); ctx.lineTo(noseStart, bodyBot-14);
  ctx.quadraticCurveTo(noseTip-3, bodyBot-14, noseTip-6, bodyBot-6); ctx.lineTo(noseTip-8, bodyBot-2);
  ctx.quadraticCurveTo(noseTip-2, bodyBot, noseStart, bodyBot); ctx.lineTo(tailTip+2, bodyBot);
  ctx.quadraticCurveTo(tailTip, bodyBot, tailTip, bodyBot-7); ctx.fill();
  ctx.fillStyle = '#E53935'; ctx.fillRect(tailTip+3, bodyBot-16, noseStart-tailTip-3, 2);

  const winY = bodyTop + 14, winH = 24, winW = 30, winGap = 7, winStartX = x - 95;
  drawTrainWindow(winStartX, winY, winW, winH, true);
  drawTrainWindow(winStartX + (winW+winGap), winY, winW, winH, false);
  drawTrainWindow(winStartX + 2*(winW+winGap), winY, winW, winH, true);
  drawTrainWindow(winStartX + 3*(winW+winGap), winY, winW, winH, false);

  ctx.fillStyle = '#FFEB3B'; ctx.beginPath(); ctx.ellipse(noseTip-10, bodyTop+26, 5, 4, 0, 0, Math.PI*2); ctx.fill();

  const wheelR = 9, wheelY = y - wheelR, wheelPositions = [x-80, x-42, x-4, x+34];
  for(const wx of wheelPositions) drawWheel(wx, wheelY, wheelR, rot);

  ctx.fillStyle = '#3a3a3a'; ctx.fillRect(tailTip, bodyBot, noseTip-tailTip+12, 6);
}

// ================= LETTERS & SIGNALS =================
function getLetterCollectTime(idx){
  return 1.5 + idx * 1.1; 
}

function drawSignalsAndLetters(offset, elapsed) {
  const trackY = GROUND_Y;
  for(let i=0; i<LETTERS.length; i++) {
    const ct = getLetterCollectTime(i);
    const signalWorldX = getScrollOffset(ct) + TANDEM_X;
    const sx = signalWorldX - offset;

    if (sx > -50 && sx < VW + 50) {
      // Houten paal
      ctx.fillStyle = '#5c4033'; ctx.fillRect(sx, trackY - 110, 8, 110);
      // Seinlamp kastje
      ctx.fillStyle = '#222'; ctx.fillRect(sx - 6, trackY - 120, 20, 35);
      
      const isPassed = elapsed >= ct;
      // Lampen
      ctx.fillStyle = isPassed ? '#d32f2f' : '#2e7d32';
      ctx.beginPath(); ctx.arc(sx + 4, trackY - 110, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = isPassed ? '#b71c1c' : '#1b5e20';
      ctx.beginPath(); ctx.arc(sx + 4, trackY - 95, 6, 0, Math.PI*2); ctx.fill();

      // Gele letterbordje
      if (elapsed < ct) {
        ctx.fillStyle = '#FFEB3B'; ctx.fillRect(sx - 16, trackY - 155, 40, 40);
        ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.strokeRect(sx - 16, trackY - 155, 40, 40);
        ctx.fillStyle = '#000'; ctx.font = 'bold 26px "Comic Sans MS",cursive';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(LETTERS[i], sx + 4, trackY - 135);
      }
    }

    if(elapsed >= ct && elapsed < ct + 0.1 && !lettersSparkled[i]) {
      lettersSparkled[i] = true;
      createSparkle(TANDEM_X, trackY - 135);
    }
  }
}

function drawCollectedBar(elapsed){
  const barY=40, totalW = LETTERS.length*35, startX = (VW-totalW)/2;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(startX-15, barY-25, totalW+30, 50);
  ctx.strokeStyle='#FFD700'; ctx.lineWidth=2; ctx.strokeRect(startX-15, barY-25, totalW+30, 50);
  
  for(let i=0;i<LETTERS.length;i++){
    const ct=getLetterCollectTime(i);
    if(elapsed>=ct){
      const destX = startX+i*35+17;
      if(elapsed < ct+0.5){
        const t=(elapsed-ct)/0.5, et=easeOutCubic(t);
        const lx=lerp(TANDEM_X, destX, et), ly=lerp(GROUND_Y-110, barY, et);
        ctx.save(); ctx.translate(lx,ly); ctx.scale(1+(1-et),1+(1-et));
        ctx.fillStyle='#FFD700'; ctx.font='bold 28px "Comic Sans MS",cursive';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(LETTERS[i],0,0); ctx.restore();
      } else {
        ctx.fillStyle='#FFD700'; ctx.font='bold 24px "Comic Sans MS",cursive';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(LETTERS[i], destX, barY);
      }
    }
  }
}

// ================= PARTICLES =================
function createSparkle(x,y){
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2, sp=80+Math.random()*60;
    particles.push({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-30, size:3+Math.random()*4, color:'#FFD700', life:0.6, maxLife:0.6, gravity:100});
  }
}

function createExplosion(x,y){
  const colors=['#FFD700','#FF6347','#FF69B4','#4169E1','#32CD32','#FFA500','#00CED1'];
  for(let i=0;i<30;i++){
    const a=Math.random()*Math.PI*2, sp=100+Math.random()*250;
    particles.push({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-80, size:4+Math.random()*6, color:colors[Math.floor(Math.random()*colors.length)], life:1.5, maxLife:1.5, gravity:200});
  }
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.gravity||100)*dt; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}

function drawParticles(){
  for(const p of particles){
    const a=clamp(p.life/p.maxLife,0,1);
    ctx.globalAlpha=a; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ================= FINALE =================
function drawFinale(elapsed){
  if (elapsed < STOP_TIME) return;

  const t = clamp((elapsed - STOP_TIME) / 1.5, 0, 1);
  if (t > 0) {
    const et = easeOutBack(t);
    const y = lerp(-100, 180, et);

    ctx.save();
    ctx.translate(VW * 0.5, y);
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;

    ctx.fillStyle = '#f4e4bc'; ctx.fillRect(-180, -50, 360, 100);
    ctx.strokeStyle = '#5c4033'; ctx.lineWidth = 8; ctx.strokeRect(-180, -50, 360, 100);

    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#5c4033';
    ctx.font = 'bold 50px "Comic Sans MS",cursive'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText("Welkom Thuis!", 0, -10);
    ctx.font = 'bold 24px "Comic Sans MS",cursive';
    ctx.fillText("- Kolhorn -", 0, 32);
    ctx.restore();

    if (elapsed > STOP_TIME + 1.5 && !finalExplosionDone) {
      finalExplosionDone = true;
      createExplosion(VW * 0.25, 200);
      createExplosion(VW * 0.75, 200);
      createExplosion(VW * 0.5, 250);
    }
  }
}

// ================= MAIN LOOP =================
function init() {
  startTime = performance.now();
  requestAnimationFrame(loop);
}

function loop(now) {
  if(!startTime) startTime = now;
  let elapsed = (now - startTime) / 1000;

  if (elapsed > TOTAL) {
      elapsed = TOTAL; 
  }

  const offset = getScrollOffset(elapsed);
  const scrollSpd = getScrollSpeed(elapsed);

  ctx.clearRect(0, 0, VW, VH);

  drawSky(elapsed);
  drawClouds(offset);

  const sceneIdx = getSceneIndex(elapsed);
  const curScene = SCENES[sceneIdx];
  
  drawBackground(curScene.type, offset, 'far');
  drawBackground(curScene.type, offset, 'mid');
  drawBackground(curScene.type, offset, 'near');

  drawGround(curScene.type, offset);
  drawSignalsAndLetters(offset, elapsed);
  drawTrain(TANDEM_X, GROUND_Y, elapsed, scrollSpd);

  drawCollectedBar(elapsed);
  updateParticles(1/60);
  drawParticles();
  drawFinale(elapsed);

  if (elapsed < TOTAL) {
    requestAnimationFrame(loop);
  }
}

// Start
window.addEventListener('load', () => {
    init();
});

</script>
